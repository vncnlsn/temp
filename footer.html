<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APS 3-Column Centered Footer Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy:        #1E3B5F;
      --navy-deep:   #16222C;
      --paper:       #FAF6EA;
      --paper-soft:  rgba(250,246,234,.9);
      --clay:        #B23A28;
      --clay-bright: #D9755F;
      --line-on-navy: rgba(250,246,234,.12);
      --shell: 1440px;
      --serif: 'Spectral', Georgia, serif;
      --sans: 'Public Sans', -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --ease: cubic-bezier(.22,.61,.36,1);
    }

    body {
      margin: 0;
      background: #0D141B;
      font-family: var(--sans);
      color: var(--paper);
    }

    *{ box-sizing: border-box; }
    a{ color: inherit; text-decoration: none; }
    .shell{ max-width: var(--shell); margin: 0 auto; padding: 0 56px; }

    /* ================= CTA BAND ================= */
    .cta-band { 
      background: var(--navy-deep); 
      padding: clamp(64px, 7vw, 92px) 0; 
      border-bottom: 1px solid var(--line-on-navy);
    }
    .cta-inner { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: clamp(24px, 3vw, 32px); 
      text-align: center; 
    }
    .cta-inner h2 { 
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.8vw, 2.2rem); 
      color: var(--paper); 
      margin: 0;
      font-weight: 600;
    }
    .cta-actions { 
      display: flex; 
      flex-wrap: wrap; 
      align-items: center; 
      justify-content: center; 
      gap: 16px; 
    }
    .cta-btn {
      display: inline-flex; 
      align-items: center; 
      gap: 12px; 
      padding: 15px 28px;
      border: 1px solid var(--paper-soft); 
      color: var(--paper);
      font-size: .86rem; 
      font-weight: 600; 
      flex: 0 0 auto;
      transition: background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);
    }
    .cta-btn:hover { 
      background: var(--clay); 
      border-color: var(--clay); 
    }
    .cta-btn .arrow { 
      transition: transform .25s var(--ease); 
    }
    .cta-btn:hover .arrow { 
      transform: translateX(4px); 
    }

    /* ================= FOOTER REDESIGN ================= */
    footer { 
      background: linear-gradient(180deg, #16222C 0%, #111B23 100%); 
      color: var(--paper); 
      padding: 64px 0 32px; 
      position: relative;
      border-top: 2px solid var(--clay);
    }

    .footer-grid { 
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px; 
      padding-bottom: 48px; 
      border-bottom: 1px solid var(--line-on-navy); 
      text-align: center;
      align-items: start;
    }

    /* Column 1: Logo & Linked HQ Badge */
    .footer-brand { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      text-align: center;
    }

    .footer-logo-img { 
      height: 32px; 
      width: auto; 
      filter: brightness(0) invert(1); 
      margin: 0 auto 12px auto; 
      display: block;
    }

    .footer-brand-fallback { 
      display: none; 
      font-family: var(--serif); 
      font-weight: 600; 
      font-size: 1.25rem; 
      color: var(--paper); 
      margin-bottom: 8px; 
    }

    .footer-brand p { 
      font-size: .85rem; 
      color: rgba(250,246,234,.7); 
      line-height: 1.5; 
      font-family: var(--sans); 
      margin: 0; 
      text-align: center;
    }

    .footer-hq-badge {
      display: inline-block;
      margin-top: 16px; /* Added breathing room */
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--clay-bright);
      background: rgba(217,117,95,.08);
      border: 1px solid rgba(217,117,95,.2);
      padding: 6px 14px;
      border-radius: 3px;
      transition: background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
    }

    .footer-hq-badge:hover {
      background: rgba(217,117,95,.18);
      border-color: rgba(217,117,95,.4);
      color: var(--paper);
    }

    /* Headers */
    footer h4 { 
      font-family: var(--mono); 
      font-size: .68rem; 
      letter-spacing: .12em; 
      text-transform: uppercase; 
      color: var(--clay-bright); 
      margin: 0 0 18px; 
      font-weight: 600; 
      text-align: center;
    }

    /* Column 2 & 3 Flex Containers */
    footer ul { 
      list-style: none; 
      margin: 0; 
      padding: 0; 
      display: flex;
      flex-direction: column;
      align-items: center; /* Ensures chips & links align centrally under headers */
    }

    footer li { 
      margin-bottom: 12px; 
      font-size: .88rem; 
      color: var(--paper-soft); 
      text-align: center;
    }

    footer li:last-child { 
      margin-bottom: 0; 
    }

    footer a { 
      color: var(--paper-soft); 
      transition: color .25s var(--ease); 
      display: inline-block;
    }

    footer a:hover { 
      color: var(--clay-bright); 
    }

    /* Contact Chips */
    .contact-link {
      background: rgba(250,246,234,.04);
      padding: 6px 14px;
      border-radius: 3px;
      border: 1px solid rgba(250,246,234,.06);
      font-family: var(--mono);
      font-size: .80rem;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .contact-link:hover {
      background: rgba(217,117,95,.1);
      border-color: rgba(217,117,95,.3);
    }

    /* Bottom Copyright Bar */
    .footer-bottom { 
      padding-top: 28px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono); 
      font-size: .70rem; 
      color: rgba(250,246,234,.5); 
    }

    @media (max-width: 768px) {
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .footer-bottom {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- CTA BAND -->
  <section class="cta-band">
    <div class="shell cta-inner">
      <h2>Let's get to work.</h2>
      <div class="cta-actions">
        <a class="cta-btn" href="contact.html">Contact Us <span class="arrow">→</span></a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="shell">
      <div class="footer-grid">
        
        <!-- Column 1: Logo, Tagline, & Maps HQ Link -->
        <div class="footer-brand">
          <img class="footer-logo-img" src="assets/APSLand_Logo.png" alt="APS Land Services" decoding="async" onerror="this.style.display='none';document.getElementById('footerLogoFallback').style.display='block'">
          <span id="footerLogoFallback" class="footer-brand-fallback">APS Land Services</span>
          <p>Setting the Standard Since 1980</p>
          <a class="footer-hq-badge" href="https://maps.google.com/?q=Logan,+UT" target="_blank" rel="noopener noreferrer">Cache Valley, Utah ↗</a>
        </div>

        <!-- Column 2: Navigation -->
        <div>
          <h4>Navigation</h4>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </div>

        <!-- Column 3: Contact (Centered Chips) -->
        <div>
          <h4>Contact</h4>
          <ul>
            <li><a class="contact-link" href="tel:+13039035873">303-903-5873</a></li>
            <li><a class="contact-link" href="mailto:allstatepermit@allstatepermit.com">allstatepermit@allstatepermit.com</a></li>
          </ul>
        </div>

      </div>

      <!-- Footer Bottom -->
      <div class="footer-bottom">
        <span>© 2026 APS Land Services. All rights reserved.</span>
        <span>Land Services Nationwide</span>
      </div>
    </div>
  </footer>

</body>
</html>
